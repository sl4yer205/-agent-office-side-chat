<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#15141c">
  <title>Agent Office · Side Chat HQ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='4' fill='%23bc9aff'/%3E%3Cpath d='M5 5h3v2h4V5h3v2h2v7h-2v2h-3v-2H8v2H5v-2H3V7h2zm2 4v3h2V9zm4 0v3h2V9z' fill='%23282535' fill-rule='evenodd'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="pixel/style.css">
  <script defer src="pixel/floor.js"></script>
  <script defer src="pixel/sprites.js"></script>
  <script defer src="pixel/simulation-live.js"></script>
  <script defer src="pixel/app.js"></script>
</head>
<body>
  <header class="mast">
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 3h2v2h6V3h2v2h2v2h2v7h-3v3h-3v-3H7v3H4v-3H1V7h2V5h2zm0 5v3h3V8zm7 0v3h3V8z"/></svg></span><b>Agent Office</b><span class="divider"></span><span class="hq">Side Chat HQ</span></div>
    <span class="sample"><i></i>Dữ liệu HQ thật</span>
  </header>
  <main>
    <div class="page-head">
      <div><div class="crumb"><i data-icon="building"></i>Studio sản phẩm <span>/</span> Tầng 01</div><h1>Văn phòng <span>pixel</span></h1></div>
      <div class="head-actions"><button class="button subtle" id="replay"><i data-icon="replay"></i>Tải lại</button><button class="button primary" id="pause"></button></div>
    </div>
    <div class="layout">
      <div class="world-column">
        <section class="panel scene-panel" aria-labelledby="map-title">
          <div class="panel-head"><h2 id="map-title"><i data-icon="map"></i>Sơ đồ văn phòng</h2><span class="live" id="live-indicator"></span></div>
          <div class="map-scroll" id="map-scroll"><div class="map-stage" id="map-stage">
            <canvas id="office" width="600" height="360" aria-label="Văn phòng pixel có sáu phòng ban, phòng họp và phòng nghỉ. Chọn nhân vật từ bản đồ hoặc danh sách nhân sự."></canvas>
            <div id="room-labels" aria-hidden="true"></div><div id="map-hits"></div><div id="bubble" class="bubble" hidden></div>
          </div></div>
          <div class="map-foot"><div class="legend"><span><b class="dot green"></b>Làm việc</span><span><b class="dot gold"></b>Cần hỗ trợ</span><span><b class="dot lilac"></b>Nghỉ</span></div><div class="zoom"><button id="zoom-out" class="icon-btn" aria-label="Thu nhỏ" title="Thu nhỏ"><i data-icon="minus"></i></button><output id="zoom-readout">100%</output><button id="zoom-in" class="icon-btn" aria-label="Phóng to" title="Phóng to"><i data-icon="plus"></i></button></div></div>
        </section>
        <section class="panel activity"><div class="panel-head"><h2><i data-icon="activity"></i>Nhật ký hoạt động</h2><span id="elapsed" class="clock">00:00</span></div><ol id="events"></ol></section>
      </div>
      <aside class="panel people" id="people">
        <div class="panel-head"><h2><i data-icon="users"></i>Nhân sự <span id="total" class="count"></span></h2><button id="add" class="button small"><i data-icon="plus"></i>Thêm</button><button id="collapse" class="icon-btn collapse" aria-label="Thu gọn nhân sự" aria-expanded="true"><i data-icon="chevron"></i></button></div>
        <div class="people-body"><div id="roster" class="roster" aria-label="Chọn nhân sự"></div><div id="profile"></div><div id="tabs" class="tabs" aria-label="Chi tiết nhân sự"></div><div id="details"></div><div class="assign-foot"><button id="assign" class="button assign"><i data-icon="briefcase"></i>Giao việc</button></div></div>
      </aside>
    </div>
  </main>
  <dialog id="modal"><form id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close-modal" class="icon-btn" aria-label="Đóng"><i data-icon="x"></i></button></div><div id="dialog-body"></div><div class="dialog-foot"><button type="button" class="button subtle" id="cancel">Hủy</button><button type="submit" class="button primary" id="confirm">Lưu</button></div></form></dialog>
  <div role="status" id="toast" class="toast" hidden></div>
</body>
</html>
